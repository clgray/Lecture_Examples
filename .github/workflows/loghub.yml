name: LogHub

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Сборка без предупреждений
        run: dotnet build LogHub/LogHub.sln --no-incremental -warnaserror

      - name: Тесты
        run: dotnet test LogHub/LogHub.sln --no-build
